name = "homnivas-app"
main = "src/index.ts"
compatibility_date = "2026-09-24"

# One project: static frontend + API + D1 + KV, one deploy..
# /api/* always hits the Worker (run_worker_first); everything else tries
# a static file first, falling back to index.html for client-side routes.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "homnivas-db"
database_id = "311f50ef-07c3-4110-8ede-90f882fef0cb"

[[kv_namespaces]]
binding = "OTP_KV"
id = "adec884dd26a42549bf8971452361c67"

# Secrets (JWT_SECRET, PAN_PEPPER, RESEND_API_KEY) are NOT set here — see
# the deploy steps / README.
